# Local stack: MongoDB, Redis, Mailpit (catches outgoing email) and the app.
#   docker compose up -d mongo redis mailpit   # just the services, for `npm run dev`
#   REDIS_PORT=6380 docker compose up -d ...   # if a host port is already in use
#   docker compose up --build                  # everything, app on http://localhost:3000
services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports: ["${MONGO_PORT:-27017}:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025" # web inbox
      - "1025:1025" # SMTP

  app:
    build: .
    profiles: [app]
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      NODE_ENV: production
      APP_URL: http://localhost:3000
      MONGO_URI: mongodb://mongo:27017/klyro
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-in-production-please-use-a-long-random-string}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Plain HTTP on localhost: cookies can't be "secure" here.
      COOKIE_INSECURE: "true"
    volumes: [uploads:/app/server/uploads]
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  mongo-data:
  redis-data:
  uploads:
